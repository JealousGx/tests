<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropdown Options Component</title>

    <meta
      name="description"
      content="A dropdown options component with custom checkboxes."
    />
    <meta
      name="keywords"
      content="HTML,CSS,JavaScript,Dropdown,Checkboxes,UI Component"
    />

    <meta name="author" content="JealousGx" />
    <meta name="author-url" content="https://jealous.dev" />

    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <ul class="list">
        <li class="list-item">
          <label for="all-pages">All pages</label>
          <input type="checkbox" class="checkbox" id="all-pages" />
        </li>
        <li class="list-item">
          <label for="page-1">Page 1</label>
          <input type="checkbox" class="checkbox page-checkbox" id="page-1" />
        </li>
        <li class="list-item">
          <label for="page-2">Page 2</label>
          <input type="checkbox" class="checkbox page-checkbox" id="page-2" />
        </li>
        <li class="list-item">
          <label for="page-3">Page 3</label>
          <input type="checkbox" class="checkbox page-checkbox" id="page-3" />
        </li>
        <li class="list-item">
          <label for="page-4">Page 4</label>
          <input type="checkbox" class="checkbox page-checkbox" id="page-4" />
        </li>
      </ul>
      <button class="button">Done</button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
